name: Release

# release-please keeps a release PR open from the conventional commits on main.
# Merging it tags the version and creates the GitHub release. The publish job
# then waits for approval in the npm environment and publishes with npm trusted
# publishing (OIDC): there is no npm token in this repository.

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    # Skipped until the release app is set up (vars.RELEASE_APP_CLIENT_ID).
    if: vars.RELEASE_APP_CLIENT_ID != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # An app token, not GITHUB_TOKEN: a pull request opened with
      # GITHUB_TOKEN does not start CI, so the release PR could not pass the
      # required checks.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Only what release-please needs: the release PR, its labels, the
          # tag and the release.
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Needs a reviewer's approval. Set the reviewers in Settings > Environments.
    environment:
      name: npm
      url: https://www.npmjs.com/package/@tektona/strands
    permissions:
      contents: read
      id-token: write # the OIDC token for npm trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      # No dependency cache in a job that publishes: a poisoned cache would
      # end up in the package.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later. The npm bundled with
      # Node LTS has it; stop early if not, rather than install one by hand.
      - name: Check the npm version
        run: |
          npm --version
          node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$(npm --version)"

      - run: npm ci

      # prepublishOnly builds and checks the package first. Trusted
      # publishing adds provenance on its own.
      - name: Publish
        run: |
          version="$(node -p 'require("./package.json").version')"
          if npm view "@tektona/strands@$version" version >/dev/null 2>&1; then
            echo "::notice::@tektona/strands@$version is already on npm. Nothing to publish."
            exit 0
          fi
          npm publish
